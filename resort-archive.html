<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HAVEN ARCHIVE — Private Resort Repository</title>
<style>
  /* ============================================================
     mga design tokens. edit dito para baguhin yung buong look
     ============================================================ */
  :root{
    --bg: #f6f5f3;
    --ink: #131313;
    --muted: #9a9a94;
    --line: rgba(19,19,19,0.12);
    --glass: rgba(255,255,255,0.55);
    --glass-strong: rgba(255,255,255,0.82);
    --accent: #b5482e;
    --card-w: 360px;
    --card-h: 480px;
    --step-x: -132px;   /* horizontal offset per card, going left */
    --step-y: 96px;     /* vertical offset per card, going down */
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow:hidden; /* wheel scroll drives the cascade, hindi yung page */
  }

  /* ---------- top nav ---------- */
  .topnav{
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; gap:0;
    padding:18px 22px;
  }
  .brand{
    border:1px solid var(--line); padding:11px 16px;
    font-size:12.5px; font-weight:600; letter-spacing:.5px;
    background:var(--glass-strong); backdrop-filter: blur(6px);
  }
  .brand sup{ font-size:8px; }
  .tabs{ display:flex; margin-left:0; }
  .tab{
    appearance:none; border:1px solid var(--line); border-left:none;
    background:transparent; color:var(--muted);
    font-size:11px; letter-spacing:1px; font-weight:500;
    padding:12px 18px; cursor:pointer;
    transition: color .25s ease, background .25s ease;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); background:var(--glass); }

  /* ---------- corner toggle (OVERVIEW / INDEX) ---------- */
  .cornernav{
    position:fixed; bottom:22px; right:22px; z-index:40;
    display:flex; border:1px solid var(--line);
    background:var(--glass-strong); backdrop-filter: blur(6px);
  }
  .corner-btn{
    appearance:none; border:none; background:transparent;
    font-size:11px; letter-spacing:1px; font-weight:600;
    padding:12px 16px; cursor:pointer; color:var(--muted);
  }
  .corner-btn + .corner-btn{ border-left:1px solid var(--line); }
  .corner-btn.active{ color:var(--ink); }

  /* ============================================================
     OVERVIEW — yung diagonal glass cascade (main deliverable)
     ============================================================ */
  .stage{
    position:relative; width:100%; height:100vh;
    perspective: 2400px;
    overflow:hidden;
  }
  .cascade{ position:absolute; inset:0; transform-style:preserve-3d; }

  .card{
    position:absolute; top:50%; left:50%;
    width:var(--card-w); height:var(--card-h);
    margin:calc(var(--card-h) / -2) 0 0 calc(var(--card-w) / -2);
    transform-style:preserve-3d;
    will-change:transform;
    cursor:pointer;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    overflow:hidden;
    background:#dcdad4;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.4) inset;
    transition: transform .55s cubic-bezier(.22,.8,.25,1), filter .55s ease;
  }
  .card:hover .card-inner{
    transform: translate3d(-26px,-26px,60px) scale(1.035);
    filter: brightness(1.04);
  }
  .card-inner img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    display:block;
  }
  /* glass sheen sweeping across the photo */
  .card-inner::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(115deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,.28) 100%);
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  /* edge glass border, parang salamin */
  .card-inner::after{
    content:"";
    position:absolute; inset:0;
    border:1px solid rgba(255,255,255,.5);
    box-shadow: inset 0 0 40px rgba(255,255,255,.08);
    pointer-events:none;
  }

  .card-label{
    position:absolute; left:0; right:0; bottom:0;
    padding:16px 18px 14px;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%);
    color:#fff;
    display:flex; justify-content:space-between; align-items:flex-end;
    opacity:0; transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .card:hover .card-label{ opacity:1; transform:translateY(0); }
  .card-label .name{
    font-size:12.5px; letter-spacing:1.5px; font-weight:600; text-transform:uppercase;
  }
  .card-label .rate{
    font-size:10.5px; letter-spacing:.5px; color:rgba(255,255,255,.75);
  }

  .card-tag{
    position:absolute; top:14px; left:16px;
    font-size:9.5px; letter-spacing:2px; text-transform:uppercase;
    color:rgba(255,255,255,.85);
    padding:5px 8px; background:rgba(0,0,0,.28);
    backdrop-filter: blur(3px);
    opacity:0; transition:opacity .4s ease;
  }
  .card:hover .card-tag{ opacity:1; }

  .stage-hint{
    position:fixed; left:24px; bottom:24px; z-index:35;
    font-size:10.5px; letter-spacing:1.5px; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }
  .stage-hint .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); }

  /* ============================================================
     INDEX — actual spreadsheet-style repository table
     ============================================================ */
  .index-view{
    position:fixed; inset:0; top:0; z-index:20;
    background:var(--bg);
    padding:96px 28px 90px;
    overflow-y:auto;
    display:none;
  }
  .index-view.visible{ display:block; }

  .index-controls{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; gap:14px; flex-wrap:wrap;
  }
  .index-controls input{
    flex:1; min-width:220px; max-width:420px;
    border:1px solid var(--line); background:var(--glass-strong);
    padding:11px 14px; font-size:12px; letter-spacing:.5px;
    color:var(--ink); outline:none;
  }
  .index-controls input::placeholder{ color:var(--muted); }
  .index-count{ font-size:11px; letter-spacing:1px; color:var(--muted); }

  .index-table-wrap{
    border:1px solid var(--line); background:var(--glass-strong);
    backdrop-filter: blur(6px);
    overflow-x:auto;
  }
  table.index-table{
    width:100%; border-collapse:collapse; min-width:1180px;
    font-size:12px;
  }
  .index-table thead th{
    text-align:left; font-size:10px; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); font-weight:600;
    padding:12px 14px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--glass-strong);
  }
  .index-table tbody td{
    padding:14px; border-bottom:1px solid var(--line);
    vertical-align:top; line-height:1.45;
  }
  .index-table tbody tr{ cursor:pointer; transition:background .2s ease; }
  .index-table tbody tr:hover{ background:rgba(0,0,0,.03); }
  .index-table td.name-cell{ font-weight:600; }
  .index-table td.name-cell .fb{ display:block; font-weight:400; color:var(--muted); font-size:11px; margin-top:2px; }
  .pill{
    display:inline-block; font-size:10px; letter-spacing:.5px;
    border:1px solid var(--line); padding:2px 7px; margin:2px 4px 0 0;
    color:var(--ink); border-radius:2px;
  }

  /* ============================================================
     modal — full resort detail (parehong columns na binigay mo)
     ============================================================ */
  .modal-overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(19,19,19,.42);
    backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-overlay.visible{ display:flex; }
  .modal-card{
    width:min(760px, 100%); max-height:88vh; overflow-y:auto;
    background:#fff; border:1px solid var(--line);
    box-shadow:0 40px 80px -30px rgba(0,0,0,.5);
  }
  .modal-photo{ width:100%; height:260px; object-fit:cover; display:block; }
  .modal-body{ padding:26px 30px 30px; }
  .modal-body h2{ margin:0 0 4px; font-size:20px; letter-spacing:.3px; }
  .modal-body .sub{ font-size:12px; color:var(--muted); margin-bottom:20px; }
  .modal-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:16px 24px;
    margin-bottom:18px;
  }
  .modal-grid .field label{
    display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); margin-bottom:4px;
  }
  .modal-grid .field div{ font-size:13px; }
  .modal-close{
    position:sticky; top:0; float:right; margin:14px 14px 0 0;
    border:1px solid var(--line); background:rgba(255,255,255,.9);
    width:30px; height:30px; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }

  @media (max-width: 720px){
    :root{ --card-w:260px; --card-h:340px; --step-x:-92px; --step-y:68px; }
    .tabs{ display:none; }
    .index-view{ padding:96px 14px 90px; }
    .modal-grid{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
    .card-label, .card-tag{ transition:none; }
  }
</style>

<body>

  <header class="topnav">
    <div class="brand">HAVEN <sup>®</sup> ARCHIVE</div>
    <nav class="tabs">

    <button class="corner-btn" data-mode="index">INDEX</button>

  <!-- detail modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard"></div>

<script>
/* ============================================================

   name, contact/fb, rate 12h, rate 22h, pax, add'l pax rate,
   rooms, pool size/depth, inclusions, amenities, photo
   ============================================================ */
const resorts = [

/* helper: build a stable placeholder photo url per resort */
function photo_url(seed, w, h){
  return "https://picsum.photos/seed/" + seed + "/" + w + "/" + h;
}

/* ============================================================
   2. OVERVIEW — diagonal glass cascade (scroll + hover)
   ============================================================ */
const cascade_el = document.getElementById("cascade");
const stage_el = document.getElementById("stage");

// duplicate list twice para may laman pag umiikot yung loop
const cascade_items = resorts.concat(resorts);
const total = cascade_items.length;

const card_els = cascade_items.map((r, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.index = i % resorts.length;

  const inner = document.createElement("div");
  inner.className = "card-inner";

  const img = document.createElement("img");
  img.src = photo_url(r.seed, 700, 900);
  img.alt = r.name;
  img.loading = "lazy";
  inner.appendChild(img);

  const tag = document.createElement("div");
  tag.className = "card-tag";
  tag.textContent = "HAVEN / " + (i + 1).toString().padStart(2, "0");
  inner.appendChild(tag);

  const label = document.createElement("div");
  label.className = "card-label";
  label.innerHTML =
    '<span class="name">' + r.name + '</span>' +
    '<span class="rate">' + r.rate12 + ' / 12h</span>';
  inner.appendChild(label);

  card.appendChild(inner);
  card.addEventListener("click", () => open_modal(r));
  cascade_el.appendChild(card);
  return card;
});

// diagonal direction vector, derived from the css step values
const step_len = Math.hypot(132, 96);
const dir_x = -132 / step_len;
const dir_y = 96 / step_len;

let scroll_target = 0;   // saan gustong puntahan ng cascade
let scroll_current = 0;  // saan siya ngayon (lerp papunta sa target)

function wrap_position(raw){
  const span = total * step_len;
  let v = raw % span;
  if (v < 0) v += span;
  return v - span / 2; // i-center yung range para pareho lumalabas sa dalawang gilid
}

function render_cascade(){
  card_els.forEach((card, i) => {
    const raw = i * step_len + scroll_current;
    const pos = wrap_position(raw);
    const x = pos * dir_x;
    const y = pos * dir_y;
    card.style.transform =
      "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0) " +
      "rotateX(7deg) rotateY(-20deg)";
    card.style.zIndex = Math.round(1000 - Math.abs(pos));
  });
}

function tick(){
  scroll_current += (scroll_target - scroll_current) * 0.09;
  render_cascade();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

stage_el.addEventListener("wheel", (e) => {
  e.preventDefault();
  scroll_target += (e.deltaY + e.deltaX) * 1.1;
}, { passive: false });

// touch support pang mobile
let touch_start_y = null;
stage_el.addEventListener("touchstart", (e) => {
  touch_start_y = e.touches[0].clientY;
});
stage_el.addEventListener("touchmove", (e) => {
  if (touch_start_y === null) return;
  const dy = touch_start_y - e.touches[0].clientY;
  scroll_target += dy * 2.2;
  touch_start_y = e.touches[0].clientY;
}, { passive: true });

/* ============================================================
   3. INDEX — table view (yung actual repository)
   ============================================================ */
const index_body = document.getElementById("indexBody");
const index_count = document.getElementById("indexCount");
const search_input = document.getElementById("searchInput");

function pill_list(items){
  return items.map(t => '<span class="pill">' + t + '</span>').join("");
}

function render_index(list){
  index_body.innerHTML = list.map(r => (
    '<tr data-seed="' + r.seed + '">' +
      '<td class="name-cell">' + r.name + '<span class="fb">' + r.location + '</span></td>' +
      '<td>' + r.contact + '</td>' +
      '<td>' + r.rate12 + '</td>' +
      '<td>' + r.rate22 + '</td>' +
      '<td>' + r.pax + '</td>' +
      '<td>' + r.addPax + '</td>' +
      '<td>' + r.rooms + '</td>' +
      '<td>' + r.pool + '</td>' +
      '<td>' + pill_list(r.inclusions) + '</td>' +
      '<td>' + pill_list(r.amenities) + '</td>' +
    '</tr>'
  )).join("");
  index_count.textContent = list.length + " RESORT" + (list.length === 1 ? "" : "S");

  [...index_body.querySelectorAll("tr")].forEach((row, i) => {
    row.addEventListener("click", () => open_modal(list[i]));
  });
}
render_index(resorts);

search_input.addEventListener("input", () => {
  const q = search_input.value.trim().toLowerCase();
  const filtered = resorts.filter(r =>
    r.name.toLowerCase().includes(q) || r.location.toLowerCase().includes(q)
  );
  render_index(filtered);
});

/* ============================================================
   4. modal — full resort detail card
   ============================================================ */
const modal_overlay = document.getElementById("modalOverlay");
const modal_card = document.getElementById("modalCard");

function open_modal(r){
  modal_card.innerHTML =
    '<img class="modal-photo" src="' + photo_url(r.seed, 900, 500) + '" alt="' + r.name + '">' +
    '<button class="modal-close" id="modalClose">✕</button>' +
    '<div class="modal-body">' +
      '<h2>' + r.name + '</h2>' +
      '<div class="sub">' + r.location + ' · ' + r.contact + '</div>' +
      '<div class="modal-grid">' +
        '<div class="field"><label>Rate (12h)</label><div>' + r.rate12 + '</div></div>' +
        '<div class="field"><label>Rate (22h)</label><div>' + r.rate22 + '</div></div>' +
        '<div class="field"><label>Pax</label><div>' + r.pax + '</div></div>' +
        '<div class="field"><label>Additional Pax Rate</label><div>' + r.addPax + '</div></div>' +
        '<div class="field"><label>Rooms</label><div>' + r.rooms + '</div></div>' +
        '<div class="field"><label>Pool</label><div>' + r.pool + '</div></div>' +
      '</div>' +
      '<div class="field"><label>Inclusions</label><div>' + pill_list(r.inclusions) + '</div></div>' +
      '<br>' +
      '<div class="field"><label>Amenities</label><div>' + pill_list(r.amenities) + '</div></div>' +
    '</div>';
  modal_overlay.classList.add("visible");
  document.getElementById("modalClose").addEventListener("click", close_modal);
}
function close_modal(){ modal_overlay.classList.remove("visible"); }
modal_overlay.addEventListener("click", (e) => {
  if (e.target === modal_overlay) close_modal();
});

/* ============================================================
   5. view switching — OVERVIEW <-> INDEX (parehong corner toggle
   at top tabs ang pwedeng pindutin)
   ============================================================ */
const index_view = document.getElementById("indexView");
const corner_btns = document.querySelectorAll(".corner-btn");
const tab_btns = document.querySelectorAll(".tab");

function set_view(mode){
  const is_index = mode === "index";
  index_view.classList.toggle("visible", is_index);
  stage_el.style.visibility = is_index ? "hidden" : "visible";
  corner_btns.forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  tab_btns.forEach(b => b.classList.toggle("active", b.dataset.view === mode));
}

corner_btns.forEach(b => b.addEventListener("click", () => set_view(b.dataset.mode)));
tab_btns.forEach(b => b.addEventListener("click", () => set_view(b.dataset.view)));
</script>
</body>
